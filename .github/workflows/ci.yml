# Checks of this repository:
# - spec: tools/check-spec.sh (spec/ is unchanged except its heap locale, which matches the
#   generated locale; see PLAN.md);
# - rust: cargo test;
# - translation: urust/ is what the newest front end (master) generates from core/src/lib.rs;
# - proofs: every Isabelle session of urust/, spec/ and proof/ on AutoCorrode, with HTML;
# - pages: on main, the HTML of the proofs is published with GitHub Pages.
name: CI
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The AutoCorrode revision the proofs are checked against.
  AUTOCORRODE_REV: 5366db727a5538b10a4b4a20f2959634ab8f3a42

jobs:
  spec:
    name: spec unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check spec/ (tools/check-spec.sh)
        run: tools/check-spec.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo test
        run: cargo test --release

  translation:
    name: translation up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the front end (newest master, never pinned)
        uses: actions/checkout@v4
        with:
          repository: ZhichengHui/AutoCorrodeRustFrontEnd
          ref: master
          path: .urust-frontend
      - name: Build the front end (outside this repository's Cargo workspace)
        run: |
          mv .urust-frontend "$RUNNER_TEMP/urust-frontend"
          cd "$RUNNER_TEMP/urust-frontend" && cargo build --release
      - name: Regenerate urust/ and compare with the committed one
        run: |
          NAME=$(sed -n 's/^session "\([A-Za-z0-9_]*\)".*/\1/p' urust/ROOT | head -1)
          RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup} "$RUNNER_TEMP/urust-frontend/scripts/urust-frontend.sh" \
            --out urust.new --name "$NAME" core/src/lib.rs
          echo "front end: $(git -C "$RUNNER_TEMP/urust-frontend" rev-parse --short HEAD)"
          diff -r urust urust.new
      - name: The translation has no placeholders
        run: grep -q ': 0$' urust/PLACEHOLDERS.txt || { cat urust/PLACEHOLDERS.txt; exit 1; }

  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: makarius/isabelle:Isabelle2026
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Checkout AutoCorrode
        uses: actions/checkout@v4
        with:
          repository: ZhichengHui/AutoCorrode
          ref: ${{ env.AUTOCORRODE_REV }}
          path: autocorrode
      - name: Checkout AFP
        uses: actions/checkout@v4
        with:
          repository: isabelle-prover/mirror-afp-2026
          path: afp
      - name: Isabelle environment
        shell: bash
        run: |
          /home/isabelle/Isabelle/bin/isabelle getenv ISABELLE_HOME >> $GITHUB_ENV
          /home/isabelle/Isabelle/bin/isabelle getenv ISABELLE_HOME_USER >> $GITHUB_ENV
      - name: Cache the AutoCorrode heap
        uses: actions/cache@v4
        with:
          path: ${{ env.ISABELLE_HOME_USER }}/heaps/
          key: heaps-${{ env.AUTOCORRODE_REV }}
      - name: Build AutoCorrode
        shell: bash
        run: |
          $ISABELLE_HOME/bin/isabelle build -b -v -o threads=4 \
            -d autocorrode -d afp/thys/Word_Lib AutoCorrode
      - name: Check all proofs and write the HTML
        shell: bash
        run: |
          free -g
          SESSIONS=$(cat urust/ROOT spec/ROOT proof/ROOT | sed -n 's/^session "\([A-Za-z0-9_]*\)".*/\1/p')
          echo "Sessions: $SESSIONS"
          $ISABELLE_HOME/bin/isabelle build -v -o threads=4 -o browser_info -P html \
            -d autocorrode -d afp/thys/Word_Lib -d urust -d spec -d proof $SESSIONS
      - name: Front page with this project's sessions
        shell: bash
        run: tools/pages-index.sh html "Sat"
      - name: Upload the HTML
        uses: actions/upload-pages-artifact@v3
        with:
          path: html

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ spec, rust, proofs ]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
