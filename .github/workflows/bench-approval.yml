# A change of bench/ (a new suite, a change of one, the list of active suites) needs the owner's
# approval: this check fails until the pull request has the label owner-approved (PLAN.md,
# Benchmarks). A separate workflow, so that adding the label reruns only this check.
name: bench approval
permissions:
  contents: read
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
jobs:
  approval:
    name: bench approved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changes of bench/ need the label owner-approved
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'owner-approved') }}
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- bench | grep -q .; then
            [ "$APPROVED" = true ] || { echo "bench/ changed: needs the label owner-approved"; exit 1; }
          fi
